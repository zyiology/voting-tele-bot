[project]
name = "voting-tele-bot"
version = "0.1.0"
description = "Telegram score voting bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
]

[project.scripts]
voting-bot = "voting_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voting_bot"]

[dependency-groups]
dev = [
    "ty>=0.0.32",
]
